<title>Climas de España · La Tierra que nos alimenta</title>
<style>
:root{color-scheme:light;--ink:#203f43;--paper:#f5f0e6;--white:#fffdf7;--sage:#9aae9a;--blue:#5b7fd3;--line:#d8c6a5}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.45 "Open Sans",system-ui,sans-serif}
main{max-width:1160px;margin:auto;padding:clamp(1rem,4vw,3rem)}
header p{font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;margin:0}
h1{font:700 clamp(2rem,5vw,3.7rem)/1.06 Georgia,serif;margin:.4rem 0 1.2rem}
.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(17rem,1fr);gap:1.35rem;align-items:start}
figure{margin:0}.map{position:relative;background:#d3eaf8;border:1px solid #9eafa9;border-radius:1rem;overflow:hidden;box-shadow:0 10px 28px #203f4317}
#map{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
#marker{display:none;pointer-events:none;position:absolute;width:24px;height:24px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px var(--ink);background:var(--ink);transform:translate(-50%,-50%)}
figcaption{font-size:.77rem;margin:.65rem 0}
a{color:#234e78;text-underline-offset:3px}
.controls{background:var(--white);border:1px solid var(--line);border-radius:1rem;padding:1.15rem}
.top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-size:.82rem;font-weight:700}
progress{width:100%;height:.55rem;accent-color:#44735b;display:block;margin:.55rem 0 .85rem}
h2{margin:.3rem 0 .55rem;font:700 1.65rem/1.15 Georgia,serif}
p{margin:.55rem 0}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
button{background:var(--white);color:var(--ink);border:1px solid #788b84;border-radius:.65rem;padding:.53rem .72rem;font:inherit;font-weight:650;min-height:44px;cursor:pointer}
button.primary{background:var(--ink);color:white;border-color:var(--ink)}
button:focus-visible,summary:focus-visible,h2:focus-visible{outline:3px solid #2854a8;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
#feedback:not(:empty){padding:.58rem .7rem;background:#e8eee4;border-radius:.55rem}
#feedback[data-kind="retry"]{background:#f3e4cc}
details{margin-top:.8rem}summary{cursor:pointer;font-weight:700;padding:.35rem 0}
#choices{display:grid;gap:.32rem;margin-top:.4rem}
#choices button{text-align:left;font-size:.87rem}
[hidden]{display:none!important}
@media(max-width:760px){.layout{display:flex;flex-direction:column;gap:1rem}.controls{order:-1;width:100%}figure{width:100%}}
</style>

let order, index, firstTries, attempts, solved;
function shuffled(values) {
  const copy = [...values];
  for (let i=copy.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
function updateProgress() {
  byId('progressText').textContent = index < order.length ? 'Clima '+(index+1)+' de '+order.length : 'Actividad completada';
  byId('score').textContent = 'A la primera: '+firstTries;
  byId('progress').value = Math.min(index+Number(solved),order.length);
}
function showQuestion(focus) {
  solved = false;
  attempts = 0;
  question.textContent = climates[order[index]].name;
  byId('instruction').textContent = 'Toca en el mapa una zona donde se dé este clima.';
  hint.hidden = false;
  hintText.hidden = true;
  hintText.textContent = '';
  feedback.textContent = '';
  marker.style.display = 'none';
  next.hidden = true;
  restart.hidden = true;
  options.hidden = false;
  options.querySelectorAll('button').forEach(button => button.disabled = false);
  updateProgress();
  if (focus) question.focus();
}
function begin(focus) {
  order = shuffled(climates.map((_,i) => i));
  index = 0;
  firstTries = 0;
  showQuestion(focus);
}
function answer(guess) {
  if (solved || index >= order.length) return;
  const current = climates[order[index]];
  if (guess === null) {
    feedback.dataset.kind = 'retry';
    feedback.textContent = 'Toca dentro de una zona coloreada del mapa.';
    return;
  }
  attempts++;
  if (guess !== order[index]) {
    feedback.dataset.kind = 'retry';
    feedback.textContent = 'Esa zona corresponde a «'+climates[guess].name+'». Prueba otra vez.';
    return;
  }
  solved = true;
  if (attempts === 1) firstTries++;
  feedback.dataset.kind = 'correct';
  feedback.textContent = '¡Correcto! '+current.zone+'. '+current.hint;
  next.textContent = index === order.length-1 ? 'Ver resultado' : 'Siguiente';
  next.hidden = false;
  options.querySelectorAll('button').forEach(button => button.disabled = true);
  updateProgress();
  next.focus();
}
map.addEventListener('click', event => {
  if (!ready || solved || index >= order.length) return;
  const rect = map.getBoundingClientRect();
  const x = (event.clientX-rect.left)/rect.width;
  const y = (event.clientY-rect.top)/rect.height;
  const pixelX = Math.min(canvas.width-1,Math.max(0,Math.floor(x*canvas.width)));
  const pixelY = Math.min(canvas.height-1,Math.max(0,Math.floor(y*canvas.height)));
  const value = ctx.getImageData(pixelX,pixelY,1,1).data[0];
  marker.style.left = (x*100)+'%';
  marker.style.top = (y*100)+'%';
  marker.style.display = 'block';
  answer(value ? value-1 : null);
});
shuffled(climates.map((_,i) => i)).forEach(i => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = climates[i].zone;
  button.addEventListener('click',() => { marker.style.display='none'; answer(i); });
  byId('choices').append(button);
});
hint.addEventListener('click',() => {
  hintText.textContent = 'Pista: '+climates[order[index]].hint;
  hintText.hidden = false;
  hintText.setAttribute('role','status');
});
next.addEventListener('click',() => {
  index++;
  if (index < order.length) {
    showQuestion(true);
    return;
  }
  question.textContent = '¡Has localizado los seis climas!';
  byId('instruction').textContent = 'Has acertado '+firstTries+' de '+order.length+' a la primera.';
  feedback.textContent = '';
  hint.hidden = hintText.hidden = next.hidden = options.hidden = true;
  marker.style.display = 'none';
  restart.hidden = false;
  updateProgress();
  question.focus();
});
restart.addEventListener('click',() => begin(true));
begin(false);
</script>
