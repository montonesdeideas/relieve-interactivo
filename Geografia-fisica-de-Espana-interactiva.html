<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geografía física de España · Coloca las etiquetas</title>
<style>
:root { color-scheme: light; --ink:#203f43; --paper:#f5f0e6; --line:#c7d2c8; --blue:#285383; --green:#235c43; --red:#943832; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:1rem/1.45 system-ui,sans-serif; }
main { max-width:1200px; margin:auto; padding:clamp(16px,3vw,36px); }
h1 { font:700 clamp(2rem,5vw,3.5rem)/1.06 Georgia,serif; margin:0 0 14px; }
h2 { font:700 1.45rem Georgia,serif; margin:0 0 7px; }
p { margin:.4em 0; }
button { color:inherit; font:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible { outline:3px solid #146cb5; outline-offset:3px; }
button:disabled { opacity:.55; cursor:default; }
.rounds,.actions { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.rounds button,.actions button,.chip { background:#fffaf1; border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:44px; }
.rounds [aria-pressed="true"],.actions .primary { background:var(--ink); color:white; border-color:var(--ink); }
.board { display:grid; grid-template-columns:minmax(0, 1fr) minmax(215px, 270px); gap:22px; align-items:start; }
figure { margin:0; }
.map { position:relative; isolation:isolate; }
.map img { display:block; width:100%; height:auto; border-radius:8px; }
.pin { position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%); width:clamp(26px,4.3vw,36px); aspect-ratio:1; padding:0; border:2px solid white; background:var(--ink); color:white; box-shadow:0 0 0 1px var(--ink); border-radius:50%; font-weight:750; font-size:.84rem; }
.pin.filled { background:var(--blue); }
.pin.good,.chip.good { background:var(--green); color:white; }
.pin.bad,.chip.bad { background:var(--red); color:white; }
.pin.over { outline:4px solid #fae291; }
figcaption { margin-top:8px; font-size:.78rem; }
a { color:#244f77; }
.tray { display:flex; flex-wrap:wrap; align-content:start; gap:7px; padding:5px 0; }
.chip { text-align:left; }
.chip[aria-pressed="true"] { outline:3px solid var(--blue); outline-offset:1px; }
.chip .number { font-size:.8em; font-weight:750; margin-right:4px; }
#status { min-height:2.9em; font-weight:600; }
@media(max-width:760px) {
 .board { grid-template-columns:1fr; gap:10px; }
 .controls { grid-row:1; }
 .chip { min-height:36px; padding:4px 8px; font-size:.89rem; }
 .actions { margin-bottom:6px; }
 #status { min-height:1.5em; }
}
</style>
</head>

<main>

<p>Arrastra cada nombre a un punto del mapa. También puedes tocar el nombre y luego el punto.</p>

</nav>

</section>
</div>

const map=document.querySelector('.map');
const mapImage=document.querySelector('#map-image');
const tray=document.querySelector('.tray');
const status=document.querySelector('#status');
const tabs=[...document.querySelectorAll('[data-round]')];
let current='relief';
function shuffle(values) {
  for(let i=values.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [values[i],values[j]]=[values[j],values[i]];
  }
  return values;
}
for(const round of Object.values(rounds)){
  round.order=shuffle(round.points.map((_,i)=>i));
  round.placed=round.points.map(()=>null);
}
function clearFeedback(round){
  round.checked=false;
  status.textContent='';
}
function render(focus){
  const round=rounds[current];
  document.querySelector('#round-title').textContent=round.title;
  for(const tab of tabs) tab.setAttribute('aria-pressed',String(tab.dataset.round===current));
  if(mapImage.getAttribute('src')!==round.image) mapImage.src=round.image;
  mapImage.alt=round.alt;
  map.querySelectorAll('.pin').forEach(pin=>pin.remove());
  tray.replaceChildren();
  round.points.forEach(([,x,y],i)=>{
    const placed=round.placed[i];
    const pin=document.createElement('button');
    pin.type='button';
    pin.className='pin';
    pin.dataset.pin=i;
    pin.style.setProperty('--x',100*x/800+'%');
    pin.style.setProperty('--y',100*y/655+'%');
    pin.textContent=i+1;
    pin.setAttribute('aria-label',placed===null?'Punto '+(i+1):'Punto '+(i+1)+', '+round.points[placed][0]);
    if(placed!==null)pin.classList.add('filled');
    if(round.checked&&placed!==null)pin.classList.add(i===placed?'good':'bad');
    pin.addEventListener('click',()=>{
      if(round.selected!==undefined)place(round.selected,i);
      else if(placed!==null){
        round.selected=placed;
        render('[data-label="'+placed+'"]');
        status.textContent='Etiqueta seleccionada. Elige otro punto para moverla.';
      }else status.textContent='Elige primero una etiqueta.';
    });
    pin.addEventListener('dragover',event=>{
      event.preventDefault();
      event.dataTransfer.dropEffect='move';
      pin.classList.add('over');
    });
    pin.addEventListener('dragleave',()=>pin.classList.remove('over'));
    pin.addEventListener('drop',event=>{
      event.preventDefault();
      pin.classList.remove('over');
      const raw=event.dataTransfer.getData('text/plain');
      const [key,index]=raw.split(':');
      if(key===current&&/^\d+$/.test(index)&&round.points[Number(index)])place(Number(index),i);
    });
    map.append(pin);
  });
  round.order.forEach(i=>{
    const chip=document.createElement('button');
    const position=round.placed.indexOf(i);
    chip.type='button';
    chip.className='chip';
    chip.dataset.label=i;
    chip.draggable=true;
    chip.setAttribute('aria-pressed',String(round.selected===i));
    if(position!==-1){
      const badge=document.createElement('span');
      badge.className='number';
      badge.textContent=position+1;
      chip.append(badge);
      if(round.checked)chip.classList.add(position===i?'good':'bad');
    }
    chip.append(round.points[i][0]);
    chip.addEventListener('click',()=>{
      round.selected=round.selected===i?undefined:i;
      render('[data-label="'+i+'"]');
      status.textContent=round.selected===undefined?'':'Ahora elige un punto del mapa.';
    });
    chip.addEventListener('dragstart',event=>{
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('text/plain',current+':'+i);
    });
    tray.append(chip);
  });
  if(focus)document.querySelector(focus)?.focus({preventScroll:true});
}
function place(label,position){
  const round=rounds[current];
  const previous=round.placed.indexOf(label);
  if(previous===position){
    round.selected=undefined;
    render('[data-pin="'+position+'"]');
    return;
  }
  const displaced=round.placed[position];
  if(previous!==-1)round.placed[previous]=displaced;
  round.placed[position]=label;
  round.selected=undefined;
  clearFeedback(round);
  render('[data-pin="'+position+'"]');
  status.textContent=round.points[label][0]+' en el punto '+(position+1)+'.';
}
for(const tab of tabs)tab.addEventListener('click',()=>{
  rounds[current].selected=undefined;
  current=tab.dataset.round;
  status.textContent='';
  render();
});
document.querySelector('#check').addEventListener('click',()=>{
  const round=rounds[current];
  const placed=round.placed.filter(i=>i!==null).length;
  const correct=round.placed.filter((label,i)=>label===i).length;
  const missing=round.points.length-placed;
  round.checked=true;
  render();
  if(correct===round.points.length){
    status.textContent='Todas las etiquetas están bien colocadas.';
  }else{
    const count=correct+' de '+round.points.length+' correctas.';
    status.textContent=count+(placed>correct?' Revisa las marcadas en rojo.':'')+(missing?' Quedan '+missing+' por colocar.':'');
  }
});
document.querySelector('#reset').addEventListener('click',()=>{
  const round=rounds[current];
  round.placed.fill(null);
  round.selected=undefined;
  shuffle(round.order);
  clearFeedback(round);
  render();
  status.textContent='Ronda reiniciada.';
});
render();
</script>
</body>
</html>
